# Settings for compare_signal_quality.py and plot_high_snr_traces.py.
# Usage (from preprocessing/quality_control):
#   python compare_signal_quality.py settings/signal_quality_002_vs_010.yaml [--recompute]
#   python plot_high_snr_traces.py settings/signal_quality_002_vs_010.yaml [--recompute]
#
# Per mouse: label, base, color, sessions (required); suite2p_subpath, cache_dir (optional).
# Mice are plotted in the order listed.

output_dir: ~/Desktop
output_name: signal_quality_comparison   # -> <name>.png/.csv/_chan2.png, traces in <name>_high_snr_traces/

# optional: one session drawn with an outline in the lower panels and all channel-2 panels
highlight_session: ses-008_id-full065_date-20260128T174811
title: |-
  sub-002 vs. sub-010 vs. TAA0000066 (cohort2, independently known to have good signal)
  highlighted point = sub-010's own dimmest session
chan2_title: |-
  Channel 2 (red, activity-independent) is also dimmer in sub-002, but by a smaller factor
  than channel 1 — consistent with a general imaging shortfall plus an additional functional-channel deficit

# optional, defaults shown; changing any of these invalidates the cache
params: {baseline_percentile: 8, event_sigma: 3, snr_threshold: 5, skew_threshold: 1}
traces: {n_cells: 8, window_frames: 20000}

